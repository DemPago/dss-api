name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to ACR
        uses: docker/login-action@v3.4.0
        with:
          registry: dssapiregistry.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            dssapiregistry.azurecr.io/dss-api:latest
            dssapiregistry.azurecr.io/dss-api:${{ github.sha }}
          # Cache su GitHub Actions per non ri-scaricare il bundle DSS ad ogni run
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        uses: azure/login@v2.3.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Redeploy ACI
        run: |
          az container create \
            --subscription ${{ vars.AZURE_SUBSCRIPTION }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name dss-api \
            --image dssapiregistry.azurecr.io/dss-api:${{ github.sha }} \
            --registry-login-server dssapiregistry.azurecr.io \
            --registry-username ${{ secrets.REGISTRY_USERNAME }} \
            --registry-password ${{ secrets.REGISTRY_PASSWORD }} \
            --cpu 1 \
            --memory 2 \
            --ports 8080 \
            --ip-address Public \
            --location northeurope \
            --os-type Linux
