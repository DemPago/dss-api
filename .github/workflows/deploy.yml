name: Build & Push

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3.4.0
        with:
          registry: dssapiregistry.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            dssapiregistry.azurecr.io/dss-api:latest
            dssapiregistry.azurecr.io/dss-api:${{ github.sha }}
          # Cache su GitHub Actions per non ri-scaricare il bundle DSS ad ogni run
          cache-from: type=gha
          cache-to: type=gha,mode=max
