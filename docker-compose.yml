services:
  dss-api:
    build:
      context: .
      args:
        DSS_VERSION: "6.4+20260415"
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -Djava.security.egd=file:/dev/./urandom"
    volumes:
      # Persiste le Trust Service List tra i restart (evita re-download all'avvio)
      - dss-tsl-cache:/app/dss-bundle/apache-tomcat-11.0.21/temp/dss-tsl-loader
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  dss-tsl-cache:
